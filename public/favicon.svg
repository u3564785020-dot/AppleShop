<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#appleGradient)"/>
  
  <!-- Apple shape - simplified and elegant -->
  <path d="M 50 25 
           C 40 25, 32 30, 30 38
           C 28 42, 30 45, 35 45
           C 40 43, 45 42, 50 42
           C 55 42, 60 43, 65 45
           C 70 45, 72 42, 70 38
           C 68 30, 60 25, 50 25 Z" 
        fill="#ffffff" 
        stroke="#e0e0e0" 
        stroke-width="0.5"/>
  
  <!-- Apple body contour -->
  <path d="M 35 45 
           Q 35 50, 35 58
           Q 35 72, 50 78
           Q 65 72, 65 58
           Q 65 50, 65 45" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round"
        opacity="0.9"/>
  
  <!-- Leaf -->
  <path d="M 65 25 
           Q 70 23, 73 27
           Q 72 30, 69 29
           Q 67 28, 65 25 Z" 
        fill="#4ade80"
        stroke="#22c55e"
        stroke-width="0.5"/>
  
  <!-- Highlight on apple -->
  <ellipse cx="48" cy="35" rx="8" ry="6" fill="#ffffff" opacity="0.2"/>
</svg>

